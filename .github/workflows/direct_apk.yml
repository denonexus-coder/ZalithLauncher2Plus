name: Direct APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK (arm64)
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleRelease -Darch=arm64 --stacktrace

      - name: Locate and rename APK
        run: |
          APK=$(find ZalithLauncher/build/outputs/apk -name "*.apk" -path "*release*" | head -1)
          if [ -z "$APK" ]; then
            echo "Nenhum APK encontrado"
            find ZalithLauncher/build/outputs -type f
            exit 1
          fi
          mkdir -p out
          cp "$APK" "out/ZalithLauncher2Plus-v${{ github.run_number }}.apk"
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZalithLauncher2Plus-v${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
